<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 40th Birthday, Janeita!</title>
<style>
  :root {
    --bg: #f5f4f1;
    --card: #ffffff;
    --ink: #1c1b19;
    --sub: #6b6862;
    --accent: #2f6f5e;
    --accent-soft: #e6efec;
    --border: #e7e4de;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a;
      --card: #201f26;
      --ink: #f0efec;
      --sub: #a5a29c;
      --accent: #6fbfa4;
      --accent-soft: #24322d;
      --border: #33323a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151a;
    --card: #201f26;
    --ink: #f0efec;
    --sub: #a5a29c;
    --accent: #6fbfa4;
    --accent-soft: #24322d;
    --border: #33323a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .photo {
    width: 100%;
    max-width: 260px;
    border-radius: 16px;
    display: block;
    margin: 0 auto 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .spotify-embed {
    max-width: 320px;
    margin: 0 auto 16px;
  }
  .header h1 {
    font-size: 1.3rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .header p {
    margin: 0;
    color: var(--sub);
    font-size: 0.9rem;
  }
  .qr-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  #qrcode {
    display: inline-block;
    padding: 12px;
    background: #fff;
    border-radius: 14px;
    line-height: 0;
  }
  .qr-card p {
    color: var(--sub);
    font-size: 0.85rem;
    margin: 14px 0 0;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-decoration: none;
    color: inherit;
  }
  .option .left {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .option .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--sub);
  }
  .option .value {
    font-size: 1.02rem;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .badge {
    flex-shrink: 0;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .note {
    text-align: center;
    color: var(--sub);
    font-size: 0.78rem;
    margin-top: 22px;
    line-height: 1.5;
  }
  .copied {
    color: var(--accent);
  }
</style>
</head>
